[flake8]
exclude =
    venv,
    .venv,
    env,
    __pycache__,
    .git,
    .pytest_cache
max-line-length = 79

[isort]
line_length = 79
known_first_party =
    models,
    storage,
    utils,
    conftest,
    main,
    layout_service,
    homepage,
    layouts,
    comments
skip =
    venv,
    .venv,
    env,
    __pycache__,
    .git,
    .pytest_cache

[pep8]
max_line_length = 79
exclude =
    venv,
    .venv,
    env,
    __pycache__,
    .git,
    .pytest_cache

[mypy]
exclude = (venv|\.venv|env)/
ignore_missing_imports = True
