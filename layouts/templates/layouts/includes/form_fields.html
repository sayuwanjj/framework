{% if form.errors %}
    <div class="alert alert-danger" role="alert">
        <p class="mb-1">Исправьте ошибки в форме. Данные не сохранены.</p>
        {{ form.non_field_errors }}
    </div>
{% endif %}
{% for field in form %}
    <div class="mb-3">
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}
            <div class="form-text" id="{{ field.auto_id }}_helptext">
                {{ field.help_text }}
            </div>
        {% endif %}
        {% if field.errors %}
            <div class="text-danger" id="{{ field.auto_id }}_error">
                {{ field.errors }}
            </div>
        {% endif %}
    </div>
{% endfor %}
