<article class="card layout-card mb-3">
    <div class="card-body d-flex justify-content-between align-items-start">
        <div>
            <h2 class="h5 card-title">
                {{ layout.title|default:"Без названия" }}
            </h2>
            <p class="card-text text-muted mb-2">
                Версия {{ layout.version }} · срок до {{ layout.deadline }}
            </p>
            <p class="card-text mb-2">
                Дизайнер: {{ layout.designer_name }} ·
                клиент: {{ layout.client_name }}
            </p>
            <a href="{% url 'layouts:detail' layout.id %}" class="btn btn-primary btn-sm">
                Подробнее
            </a>
        </div>
        {% include "layouts/includes/layout_status.html" %}
    </div>
</article>
